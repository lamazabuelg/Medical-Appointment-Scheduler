name: HUSI Continuous Appointment Monitor (3-Hour Live Sessions)

on:
  schedule:
    # Se ejecuta cada 3 horas (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite iniciar una sesión continua de 3 horas manualmente con 1 clic

concurrency:
  group: husi-continuous-worker
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  run-surveillance-session:
    name: Sesión Continua HUSI (3 Horas / Cada 5 min)
    runs-on: ubuntu-latest
    timeout-minutes: 200 # 3 horas y 20 minutos de límite

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar motor continuo cada 5 minutos
        env:
          PYTHONUNBUFFERED: "1"
          HUSI_BASE_URL: ${{ secrets.HUSI_BASE_URL || 'https://agendatucita.husi.org.co' }}
          HUSI_TIPO_DOC: ${{ secrets.HUSI_TIPO_DOC || '1' }}
          HUSI_DOC_NUM: ${{ secrets.HUSI_DOC_NUM }}
          HUSI_PASSWORD: ${{ secrets.HUSI_PASSWORD }}
          PREFERENCIA_HORARIO: ${{ secrets.PREFERENCIA_HORARIO || 'any' }}
          PREFERENCIA_DOCTOR: ${{ secrets.PREFERENCIA_DOCTOR || 'any' }}
          MODALIDAD: ${{ secrets.MODALIDAD || 'presencial' }}
          MIN_DAYS_EARLIER: ${{ secrets.MIN_DAYS_EARLIER || '1' }}
          FECHA_MAXIMA: ${{ secrets.FECHA_MAXIMA || '' }}
          NOTIFICATION_CHANNEL: ${{ secrets.NOTIFICATION_CHANNEL || 'email' }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'husi-citas-alertas' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Iniciando sesión continua de vigilancia de 3 horas..."
          echo "El motor consultará HUSI en vivo exactamente cada 5 minutos."
          python3 husi_agent_engine.py --daemon --duration-hours 3.0 --interval 5

      - name: Auto-Reenganche de la Siguiente Sesión (Garantía 24/7)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Verificando auto-reenganche continuo para la siguiente sesión..."
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            echo "Secret GH_PAT detectado. Disparando de inmediato la siguiente sesión continua de 3 horas..."
            gh workflow run husi-monitor.yml --ref main || true
          else
            echo "Sesión completada. La siguiente sesión se disparará automáticamente vía schedule de GitHub Actions (cron: 0 */3 * * *)."
          fi

